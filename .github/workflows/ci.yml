name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libz-dev libzstd-dev catch2
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake zstd catch2
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        run: C:\vcpkg\vcpkg.exe install catch2:x64-windows zlib:x64-windows zstd:x64-windows --recurse
      - name: Configure
        shell: bash
        run: |
          if [ -f "C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Debug -DLINGUA_BUILD_TESTS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLINGUA_BUILD_TESTS=ON
          fi
      - name: Build
        run: cmake --build build --config Debug
      - name: Test
        run: ctest --test-dir build -C Debug