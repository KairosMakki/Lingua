name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            archive: zip
          - os: ubuntu-latest
            name: linux-x64
            archive: tar.gz
          - os: macos-latest
            name: macos-x64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libz-dev libzstd-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake zstd
      - name: Install vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        run: C:\vcpkg\vcpkg.exe install zlib:x64-windows zstd:x64-windows --recurse
      - name: Configure
        shell: bash
        run: |
          if [ -f "C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DLINGUA_BUILD_TESTS=OFF
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLINGUA_BUILD_TESTS=OFF
          fi
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/src/cli/Release/lingua.exe dist/ 2>/dev/null || cp build/src/cli/lingua.exe dist/
          else
            cp build/src/cli/lingua dist/ 2>/dev/null || cp build/src/cli/Release/lingua dist/
          fi
          ls dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingua-${{ matrix.name }}
          path: dist/*
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}